# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:

  # General purpose hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Essential hooks
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: 'static'
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: detect-private-key

      # Optional but useful
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-toml
      # - id: check-symlinks
      # - id: destroyed-symlinks
      - id: name-tests-test
        args: ['--pytest-test-first']

  # Python code formatting and linting with Ruff (replaces black, isort, flake8, and more)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # Run the formatter
      - id: ruff-format
      # Run the linter
      - id: ruff
        args: ['--fix']

  # Python type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: []
        args: ['--ignore-missing-imports', '--strict-optional', '--warn-redundant-casts']

  # Security checks with bandit (optional)
  - repo: https://github.com/pycqa/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ['-ll']
        exclude: '^(tests/|\.git/|\.venv/|\.uv/|\.mypy_cache/|\.ruff_cache/|__pycache__/|node_modules/|build/|dist/)'

  # Python docstring style checking (optional)
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        additional_dependencies: ['tomli']

  # Markdown linting (optional)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ['--fix']

  # Spell checking (optional)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ['--skip=*.lock,*.svg', '--ignore-words-list=nam,crate']

  # Check for hardcoded secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Validate GitHub Actions workflow files
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-github-actions
      - id: check-github-workflows

  # UV specific checks
  - repo: local
    hooks:
      # Check if uv.lock is up to date with pyproject.toml
      - id: uv-lock-check
        name: Check uv.lock is up to date
        entry: uv lock --check
        language: system
        files: 'pyproject\.toml$'
        pass_filenames: false

# Configuration for specific tools
default_language_version:
  python: python3.12

# Global excludes
exclude: |
  (?x)^(
    .*\.min\.js|
    .*\.min\.css|
    vendor/|
    node_modules/|
    migrations/|
    \.git/|
    \.tox/|
    dist/|
    build/|
    \.uv/|
    \.python-version
  )$

# Run configuration
ci:
  autofix_prs: false
  autoupdate_schedule: monthly
